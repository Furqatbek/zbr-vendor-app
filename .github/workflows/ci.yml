name: CI

on:
  pull_request:
  push:
    branches: [main, master]

defaults:
  run:
    working-directory: ZBROwner

jobs:
  quality:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ZBROwner/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Fails only on a broken push config (e.g. google-services.json for the
      # wrong package); missing-but-not-yet-configured is a warning.
      - name: Check push config
        run: npm run check:push

      - name: Test
        run: npm run test:ci
